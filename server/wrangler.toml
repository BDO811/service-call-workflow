name = "service-call-workflow-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Created by `wrangler d1 create service-call-workflow-db`. See server/README.md.
[[d1_databases]]
binding = "DB"
database_name = "service-call-workflow-db"
database_id = "50521af3-058e-476c-8103-632f4eeaeb25"

# Set with: wrangler secret put SESSION_SECRET
# Never commit the real value here — it's read from the Cloudflare secret
# store at runtime, not from this file. Per-admin logins (email + password)
# live in the `users` D1 table instead of a shared secret — see
# scripts/create-admin.mjs.

# Business config for auto OCR-extraction + auto-notify (added 2026-09-12) —
# not secret, safe to commit. Leave blank to keep that feature a no-op.
# See server/README.md for how to fill these in.
[vars]
JEFF_EMAIL = "jeff@myhomesa.com"
TECH_EMAIL = "jeff@myhomesa.com"
RESEND_FROM_EMAIL = ""
GEMINI_MODEL = "gemini-2.5-flash"

# API keys (secret — set with `wrangler secret put`, never put the real
# value here):
#   wrangler secret put GEMINI_API_KEY   # OCR + field extraction
#   wrangler secret put RESEND_API_KEY   # sends the Jeff/tech emails
