name = "service-call-workflow-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Created by `wrangler d1 create service-call-workflow-db` — paste the
# returned database_id below before deploying. See server/README.md.
[[d1_databases]]
binding = "DB"
database_name = "service-call-workflow-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# Set with: wrangler secret put ADMIN_PASSWORD
#           wrangler secret put SESSION_SECRET
# Never commit real values here — these two are read from the Cloudflare
# secret store at runtime, not from this file.
